<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14171b">
  <title>Chess ladder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='chessground/assets/main.css') }}">
  <script type="module" src="{{ url_for('static', filename='chessground/assets/app.js') }}"></script>
</head>

<body>
  <main>
    <header class="page-header">
      <h1>Chess ladder</h1>
      <a class="header-link" href="{{ url_for('profile') }}">Profile</a>
    </header>
    <div class="game-layout">
      <section class="board-column" aria-label="Chess board">
        <div id="opponent-display" class="board-player" hidden>
          <span id="opponent-name" class="board-player-name">Maia</span>
          <span id="opponent-rating" class="board-player-rating"></span>
        </div>
        <div id="board" class="cg-wrap"></div>
        <div id="player-display" class="board-player" hidden>
          <span id="player-name" class="board-player-name">You</span>
          <span id="player-rating" class="board-player-rating"></span>
        </div>
      </section>
      <aside class="sidebar">
        <form id="setup" class="panel">
          <label for="rating-category">Time control</label>
          <select id="rating-category" name="rating_category">
            <option value="blitz" selected>Blitz (3+2 or 5+5)</option>
            <option value="rapid">Rapid (15+10 or 20+10)</option>
          </select>
          <button type="submit">Find match</button>
        </form>
        <section class="panel clocks" aria-label="Chess clock">
          <div id="white-clock" class="clock-display">
            <span>White</span>
            <time>--:--</time>
          </div>
          <div id="black-clock" class="clock-display">
            <span>Black</span>
            <time>--:--</time>
          </div>
        </section>
        <section class="panel">
          <div id="status" role="status" aria-live="polite">Loading game…</div>
          <div class="actions">
            <button id="new-game" type="button" hidden>Find another match</button>
            <button id="undo" type="button" disabled>Undo</button>
            <button id="resign" type="button" disabled>Resign</button>
            <button id="download-pgn" type="button" hidden>Download PGN</button>
          </div>
        </section>
        <section class="panel">
          <h2>Moves</h2>
          <ol id="move-history" aria-label="Move history"></ol>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="promotion-dialog" aria-labelledby="promotion-title">
    <h2 id="promotion-title">Promote pawn</h2>
    <div class="promotion-options">
      <button type="button" data-piece="q" aria-label="Promote to queen">♕</button>
      <button type="button" data-piece="r" aria-label="Promote to rook">♖</button>
      <button type="button" data-piece="b" aria-label="Promote to bishop">♗</button>
      <button type="button" data-piece="n" aria-label="Promote to knight">♘</button>
    </div>
  </dialog>
</body>

</html>
