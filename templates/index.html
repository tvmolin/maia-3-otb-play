<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Maia OTB Chess</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #edf2eb;
      background: #111713;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      background:
        radial-gradient(ellipse at 18% 0%, #31412a55, transparent 38rem),
        radial-gradient(ellipse at 100% 80%, #173c3244, transparent 34rem),
        #111713;
    }

    main {
      width: min(100%, 560px);
      min-height: min(760px, calc(100vh - 40px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(145deg, #202a24, #19211d);
      border: 1px solid #34443a;
      border-radius: 14px;
      box-shadow: 0 12px 32px #0003, inset 0 1px #ffffff08;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #34443a;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
    }

    header p {
      margin: 5px 0 0;
      color: #a4b2a7;
      font-size: .9rem;
    }

    #new-game-button {
      padding: 9px 12px;
    }

    #new-game-button[hidden] {
      display: none;
    }

    #profile-link {
      color: #b6e36a;
      font-weight: 600;
      text-decoration: none;
    }

    #profile-link:hover {
      text-decoration: underline;
    }

    #history {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .message .role {
      display: block;
      margin-bottom: 3px;
      font-size: .75rem;
      font-weight: 650;
      opacity: .75;
    }

    .You {
      align-self: flex-end;
      background: #34452e;
      color: #edf2eb;
      border-bottom-right-radius: 4px;
    }

    .Engine {
      align-self: flex-start;
      background: #26332b;
      color: #edf2eb;
      border-bottom-left-radius: 4px;
    }

    #status {
      min-height: 1.4em;
      padding: 0 18px 8px;
      color: #a4b2a7;
      font-size: .85rem;
      white-space: pre-line;
    }

    #setup {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #34443a;
      background: #19211d;
    }

    #setup[hidden] {
      display: none;
    }

    #voice-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 14px;
    }

    #voice-controls[hidden] {
      display: none;
    }

    #record-button,
    #stop-recording-button {
      flex: 0 0 auto;
      min-height: 48px;
      padding: 8px 14px;
      white-space: nowrap;
    }

    #voice-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #voice-controls input[type="checkbox"] {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      margin: 0;
      padding: 0;
      accent-color: #b6e36a;
    }

    #stop-recording-button {
      background: #666;
    }

    form[hidden] {
      display: none;
    }

    #setup label {
      font-weight: 600;
    }

    #setup button {
      grid-column: 1 / -1;
      min-height: 42px;
    }

    #setup select,
    #setup input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #405045;
      border-radius: 9px;
      background: #18211c;
      color: #edf2eb;
      font: inherit;
    }

    #setup input {
      font-size: 16px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #34443a;
      background: #19211d;
    }

    input,
    #move-input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #405045;
      border-radius: 9px;
      background: #18211c;
      color: #edf2eb;
      font: inherit;
      font-size: 16px;
    }

    #move-input {
      resize: vertical;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #34452e;
      color: #edf2eb;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled {
      opacity: .55;
    }

    #go-button {
      margin: 0 14px 14px auto;
      padding: 10px 16px;
      background: #26332b;
    }

    #go-button[hidden] {
      display: none;
    }

    #help-button {
      margin: 0 0 14px 14px;
      padding: 10px 16px;
      background: #26332b;
    }

    #help-button[hidden] {
      display: none;
    }

    #copy-pgn-button {
      margin: 0 14px 14px 0;
      padding: 10px 16px;
      background: #2a603c;
    }

    #copy-pgn-button[hidden],
    #pgn-fallback[hidden] {
      display: none;
    }

    #pgn-fallback {
      width: calc(100% - 28px);
      min-height: 120px;
      margin: 0 14px 14px;
      padding: 10px;
      border: 1px solid #405045;
      border-radius: 8px;
      background: #151c18;
      color: #edf2eb;
      font: 13px ui-monospace, monospace;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      main {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      main:has(#voice-controls:not([hidden])) {
        padding-bottom: calc(68px + env(safe-area-inset-bottom));
      }

      #voice-controls:not([hidden]) {
        position: fixed;
        z-index: 10;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #34443a;
        background: linear-gradient(145deg, #202a24, #19211d);
        box-shadow: 0 -8px 24px #0005;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="header-row">
        <h1>Maia OTB Chess</h1>
        <a id="profile-link" href="/profile">Rapid profile</a>
        <button id="new-game-button" type="button" hidden>New Game</button>
      </div>
      <p id="rating-display">Rapid rating · {{ player_elo }}</p>
    </header>
    <form id="setup">
      <label for="player-color">Play as</label>
      <select id="player-color" name="color">
        <option value="random" selected>Random</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
      <button id="start-button" type="submit">Start game</button>
    </form>
    <section id="history" aria-live="polite" aria-label="Move history"></section>
    <div id="status" role="status"></div>
    <form id="move-form" hidden>
      <textarea id="move-input" name="text" rows="2" enterkeyhint="send"
        placeholder="Move or command (e.g. e4, undo, go)" autocomplete="off" autocapitalize="off" required
        aria-label="Your move"></textarea>
      <button id="send-button" type="submit">Send</button>
    </form>
    <div id="voice-controls" hidden>
      <button id="record-button" type="button">Speak move</button>
      <button id="stop-recording-button" type="button" hidden>Send move</button>
      <label><input id="speak-maia-moves" type="checkbox" checked> Speak Maia's moves</label>
    </div>
    <button id="help-button" type="button" hidden>Help</button>
    <button id="go-button" type="button" hidden>Go now</button>
    <button id="copy-pgn-button" type="button" hidden>Copy PGN</button>
    <textarea id="pgn-fallback" aria-label="PGN to copy" readonly hidden></textarea>
  </main>
  <script>
    const historyElement = document.querySelector("#history");
    const newGameButton = document.querySelector("#new-game-button");
    const setup = document.querySelector("#setup");
    const colorSelect = document.querySelector("#player-color");
    const ratingDisplay = document.querySelector("#rating-display");
    const startButton = document.querySelector("#start-button");
    const form = document.querySelector("#move-form");
    const input = document.querySelector("#move-input");
    const button = document.querySelector("#send-button");
    const voiceControls = document.querySelector("#voice-controls");
    const recordButton = document.querySelector("#record-button");
    const stopRecordingButton = document.querySelector("#stop-recording-button");
    const speakMaiaMoves = document.querySelector("#speak-maia-moves");
    const helpButton = document.querySelector("#help-button");
    const goButton = document.querySelector("#go-button");
    const copyPgnButton = document.querySelector("#copy-pgn-button");
    const pgnFallback = document.querySelector("#pgn-fallback");
    const status = document.querySelector("#status");
    let waitingForEngine = false;
    let gameEnded = false;
    let canonicalHistory = [];
    let maiaPollGeneration = 0;
    let voiceBusy = false;
    let recording = false;
    let recorder = null;
    let recordingStream = null;
    let recordingChunks = [];
    let speechAudioContext = null;
    let speechPlaybackQueue = Promise.resolve();

    function scrollHistoryToBottom() {
      requestAnimationFrame(() => {
        historyElement.scrollTop = historyElement.scrollHeight;
        historyElement.lastElementChild?.scrollIntoView({ block: "end" });
      });
    }

    function renderHistory(messages) {
      canonicalHistory = messages;
      historyElement.replaceChildren();
      for (const message of messages) {
        const bubble = document.createElement("article");
        bubble.className = `message ${message.role}`;
        const role = document.createElement("span");
        role.className = "role";
        role.textContent = message.role;
        const text = document.createElement("span");
        text.textContent = message.text;
        bubble.append(role, text);
        historyElement.append(bubble);
      }
      scrollHistoryToBottom();
    }

    function appendMessage(roleName, messageText) {
      const bubble = document.createElement("article");
      bubble.className = `message ${roleName}`;
      const role = document.createElement("span");
      role.className = "role";
      role.textContent = roleName;
      const text = document.createElement("span");
      text.textContent = messageText;
      bubble.append(role, text);
      historyElement.append(bubble);
      scrollHistoryToBottom();
    }

    function setWaitingForEngine(waiting) {
      waitingForEngine = waiting;
      historyElement.setAttribute("aria-busy", String(waiting));
      input.disabled = gameEnded || voiceBusy;
      button.disabled = waiting || gameEnded || voiceBusy;
      recordButton.disabled = waiting || gameEnded || voiceBusy || recording;
      stopRecordingButton.disabled = waiting || gameEnded || voiceBusy || !recording;
      goButton.hidden = !waiting || gameEnded;
      goButton.disabled = false;
      helpButton.hidden = !waiting || gameEnded;
      newGameButton.disabled = waiting || voiceBusy;
    }

    function renderState(data) {
      renderHistory(data.history || []);
      if (Number.isInteger(data.rating)) {
        ratingDisplay.textContent = `Rapid rating · ${data.rating}`;
      }
      if (data.started) {
        setup.hidden = true;
        form.hidden = false;
        voiceControls.hidden = false;
        newGameButton.hidden = false;
        colorSelect.value = data.player_color;
      } else if (data.new_game) {
        setup.hidden = false;
        form.hidden = true;
        voiceControls.hidden = true;
        newGameButton.hidden = true;
        colorSelect.value = "random";
        startButton.disabled = false;
        colorSelect.disabled = false;
        input.value = "";
        status.textContent = data.saved_pgn
          ? `Previous game saved to ${data.saved_pgn}. Choose a color to start again.`
          : "Choose a color to start a new game.";
      }
      gameEnded = Boolean(data.game_over || data.quit);
      if (gameEnded) setWaitingForEngine(false);
      copyPgnButton.hidden = !data.game_over;
      if (data.game_over) {
        status.textContent = `Game over${data.result ? ` (${data.result})` : ""}.`
          + (data.saved_pgn ? ` PGN saved to ${data.saved_pgn}.` : "")
          + (Number.isInteger(data.rating_change)
            ? ` Rating ${data.rating_change > 0 ? "+" : ""}${data.rating_change} (now ${data.rating}).`
            : "");
      } else if (data.quit) {
        status.textContent = "Game quit.";
      } else if (data.maia_thinking) {
        setWaitingForEngine(true);
        status.textContent = "Maia is thinking; enter go to play now.";
      } else {
        if (waitingForEngine) {
          setWaitingForEngine(false);
          if (!data.maia_error) status.textContent = "";
        }
        if (data.maia_error) status.textContent = data.maia_error;
      }
    }

    async function readResponse(response) {
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed.");
      return data;
    }

    function unlockSpeechPlayback() {
      if (!speakMaiaMoves.checked) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      try {
        if (!speechAudioContext) speechAudioContext = new AudioContext();
        if (speechAudioContext.state !== "running") {
          speechAudioContext.resume().catch((error) => {
            status.textContent = `Audio playback could not be enabled: ${error.message}`;
          });
        }
      } catch (error) {
        status.textContent = `Audio playback could not be enabled: ${error.message}`;
      }
    }

    function speakEngineMove(data) {
      if (!speakMaiaMoves.checked || typeof data.speech_text !== "string") {
        return Promise.resolve();
      }
      speechPlaybackQueue = speechPlaybackQueue.then(async () => {
        if (!speakMaiaMoves.checked) return;
        try {
          const response = await fetch("/api/speech", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: data.speech_text })
          });
          if (!response.ok) await readResponse(response);
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) throw new Error("This browser does not support audio playback.");
          if (!speechAudioContext) throw new Error("Tap the page to enable audio playback.");
          const audioData = await response.arrayBuffer();
          const audioBuffer = await speechAudioContext.decodeAudioData(audioData);
          if (speechAudioContext.state !== "running") {
            throw new Error("Tap the page to enable audio playback.");
          }
          const source = speechAudioContext.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(speechAudioContext.destination);
          await new Promise((resolve) => {
            source.addEventListener("ended", resolve, { once: true });
            source.start();
          });
        } catch (error) {
          status.textContent = `Maia's move was played, but speech playback failed: ${error.message}`;
        }
      });
      return speechPlaybackQueue;
    }

    async function pollForMaiaTurn(afterHistoryLength) {
      const generation = ++maiaPollGeneration;
      let observedHistoryLength = afterHistoryLength;
      while (generation === maiaPollGeneration) {
        await new Promise((resolve) => setTimeout(resolve, 500));
        let data;
        try {
          const response = await fetch(
            `/api/history?after=${observedHistoryLength}`,
            { cache: "no-store" }
          );
          data = await readResponse(response);
        } catch (error) {
          status.textContent = `Waiting for Maia; history refresh failed: ${error.message}`;
          continue;
        }
        if (generation !== maiaPollGeneration) return;
        observedHistoryLength = Math.max(
          observedHistoryLength,
          (data.history || []).length
        );
        renderState(data);
        await speakEngineMove(data);
        if (!data.maia_thinking) {
          if (!input.disabled) focusMoveInput();
          return;
        }
      }
    }

    function setVoiceBusy(busy) {
      voiceBusy = busy;
      input.disabled = gameEnded || busy;
      button.disabled = waitingForEngine || gameEnded || busy;
      recordButton.disabled = waitingForEngine || gameEnded || busy || recording;
      stopRecordingButton.disabled = waitingForEngine || gameEnded || busy || !recording;
      newGameButton.disabled = waitingForEngine || busy;
    }

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    async function sendVoiceMove(blob) {
      const audio = new FormData();
      const extension = blob.type.includes("ogg") ? "ogg"
        : blob.type.includes("mp4") ? "m4a" : "webm";
      audio.append("audio", blob, `recording.${extension}`);
      const historyBefore = canonicalHistory.length;
      setVoiceBusy(true);
      status.textContent = "Transcribing and interpreting locally, then sending the move...";
      try {
        const response = await fetch("/api/voice-command", { method: "POST", body: audio });
        const data = await readResponse(response);
        renderState(data);
        if (data.maia_thinking) {
          status.textContent = `Heard "${data.transcript}" as ${data.interpreted_uci}. Maia is thinking...`;
          await pollForMaiaTurn(historyBefore);
        } else if (!data.game_over && !data.quit && !data.maia_error) {
          status.textContent = `Heard "${data.transcript}" as ${data.interpreted_uci}.`;
          await speakEngineMove(data);
        } else {
          await speakEngineMove(data);
        }
      } catch (error) {
        status.textContent = error.message;
      } finally {
        setVoiceBusy(false);
      }
    }

    recordButton.addEventListener("click", async () => {
      unlockSpeechPlayback();
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        status.textContent = "Microphone access requires HTTPS with a trusted certificate. Open the secure PC address.";
        return;
      }
      if (!window.MediaRecorder) {
        status.textContent = "This browser does not support audio recording.";
        return;
      }

      setVoiceBusy(true);
      try {
        recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordingChunks = [];
        const mimeType = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"]
          .find((type) => MediaRecorder.isTypeSupported(type));
        recorder = mimeType
          ? new MediaRecorder(recordingStream, { mimeType })
          : new MediaRecorder(recordingStream);
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) recordingChunks.push(event.data);
        });
        recorder.addEventListener("stop", () => {
          recordingStream.getTracks().forEach((track) => track.stop());
          recordingStream = null;
          recording = false;
          stopRecordingButton.hidden = true;
          recordButton.hidden = false;
          const blob = new Blob(recordingChunks, { type: recorder.mimeType });
          if (blob.size) {
            sendVoiceMove(blob);
          } else {
            status.textContent = "The recording was empty. Please repeat the move.";
            setVoiceBusy(false);
          }
        });
        recorder.start();
        recording = true;
        recordButton.hidden = true;
        stopRecordingButton.hidden = false;
        status.textContent = "Recording... tap Send move when finished.";
        setVoiceBusy(false);
      } catch (error) {
        if (recordingStream) {
          recordingStream.getTracks().forEach((track) => track.stop());
          recordingStream = null;
        }
        status.textContent = error.message || "Microphone access was not granted.";
        setVoiceBusy(false);
      }
    });

    stopRecordingButton.addEventListener("click", () => {
      if (!recorder || !recording) return;
      unlockSpeechPlayback();
      recording = false;
      setVoiceBusy(true);
      status.textContent = "Preparing the recording...";
      recorder.stop();
    });

    function focusMoveInput() {
      if (form.hidden || input.disabled) return;
      input.focus({ preventScroll: true });
    }

    button.addEventListener("pointerdown", (event) => {
      if (button.disabled) return;
      event.preventDefault();
      focusMoveInput();
    });

    newGameButton.addEventListener("click", async () => {
      newGameButton.disabled = true;
      try {
        const response = await fetch("/api/new-game", { method: "POST" });
        const data = await readResponse(response);
        maiaPollGeneration += 1;
        renderState({ ...data, new_game: true });
        historyElement.removeAttribute("aria-busy");
        gameEnded = false;
        setWaitingForEngine(false);
        input.disabled = false;
        button.disabled = false;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        newGameButton.disabled = false;
      }
    });

    setup.addEventListener("submit", async (event) => {
      event.preventDefault();
      unlockSpeechPlayback();
      startButton.disabled = true;
      colorSelect.disabled = true;
      status.textContent = colorSelect.value === "black"
        ? "Maia is thinking; enter go to play now."
        : "";
      setup.hidden = true;
      form.hidden = false;
      if (colorSelect.value === "black") setWaitingForEngine(true);
      input.focus();
      try {
        const response = await fetch("/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ color: colorSelect.value })
        });
        const data = await readResponse(response);
        renderState(data);
        setWaitingForEngine(false);
        if (data.messages && data.messages.length) {
          status.textContent = "";
        }
        if (data.messages && data.messages.some((message) => message.role === "Engine")) {
          focusMoveInput();
        } else {
          input.focus();
        }
        await speakEngineMove(data);
      } catch (error) {
        status.textContent = error.message;
        setup.hidden = false;
        form.hidden = true;
        startButton.disabled = false;
        colorSelect.disabled = false;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      unlockSpeechPlayback();
      if (waitingForEngine || gameEnded) return;
      const text = input.value.trim();
      if (!text) return;

      const isMove = !["help", "undo", "resign", "concede", "q", "quit", "exit", "go"]
        .includes(text.toLowerCase());
      let engineMoveReceived = false;
      input.value = "";
      if (isMove) {
        appendMessage("You", text);
        setWaitingForEngine(true);
        status.textContent = "Maia is thinking. Select Go now to skip the delay.";
      } else {
        button.disabled = true;
      }
      try {
        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await readResponse(response);
        const historyBefore = canonicalHistory.length;
        renderState(data);
        if (data.maia_thinking) {
          status.textContent = data.action === "undo"
            ? `${data.message} Maia is thinking...`
            : "Maia is thinking. Select Go now to skip the delay.";
          await pollForMaiaTurn(historyBefore);
        } else {
          engineMoveReceived = (data.history || []).slice(historyBefore)
            .some((message) => message.role === "Engine");
          if (data.action === "help" || data.action === "undo" ||
            data.action === "resign" || data.action === "quit" ||
            data.action === "go") {
            status.textContent = data.message;
          } else if (!data.game_over && !data.quit && !data.maia_error) {
            status.textContent = "";
          }
          await speakEngineMove(data);
        }
      } catch (error) {
        renderHistory(canonicalHistory);
        try {
          const response = await fetch("/api/history");
          renderState(await readResponse(response));
        } catch (historyError) {
          status.textContent = historyError.message;
        }
        status.textContent = error.message;
        setWaitingForEngine(false);
      }
      if (engineMoveReceived) {
        focusMoveInput();
      } else if (!input.disabled) {
        input.focus();
      }
    });

    goButton.addEventListener("click", async () => {
      unlockSpeechPlayback();
      goButton.disabled = true;
      status.textContent = "Skipping the remaining think time...";
      try {
        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: "go" })
        });
        const data = await readResponse(response);
        if (data.action === "go") status.textContent = data.message;
      } catch (error) {
        status.textContent = error.message;
        goButton.disabled = false;
      }
    });

    helpButton.addEventListener("click", async () => {
      helpButton.disabled = true;
      try {
        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: "help" })
        });
        const data = await readResponse(response);
        status.textContent = data.message;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        helpButton.disabled = false;
      }
    });

    copyPgnButton.addEventListener("click", async () => {
      copyPgnButton.disabled = true;
      try {
        const response = await fetch("/api/pgn");
        const data = await readResponse(response);
        let copied = false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(data.pgn);
            copied = true;
          } catch (error) {
            copied = false;
          }
        }

        if (!copied) {
          pgnFallback.value = data.pgn;
          pgnFallback.hidden = false;
          pgnFallback.focus();
          pgnFallback.select();
          if (document.execCommand) {
            try {
              copied = document.execCommand("copy");
            } catch (error) {
              copied = false;
            }
          }
        }

        status.textContent = copied
          ? "PGN copied to clipboard."
          : "Clipboard access is unavailable. The PGN is selected below; copy it manually.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        copyPgnButton.disabled = false;
      }
    });

    fetch("/api/history")
      .then(readResponse)
      .then((data) => {
        renderState(data);
        if (data.maia_thinking) {
          pollForMaiaTurn((data.history || []).length);
        }
      })
      .catch((error) => { status.textContent = error.message; });
  </script>
</body>

</html>
