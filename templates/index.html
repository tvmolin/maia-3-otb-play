<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>Maia OTB Chess</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #202124;
      background: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    main {
      width: min(100%, 560px);
      min-height: min(760px, calc(100vh - 40px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0000000d;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #e6e6e6;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 { margin: 0; font-size: 1.15rem; }
    header p { margin: 5px 0 0; color: #666; font-size: .9rem; }
    #new-game-button { padding: 9px 12px; }
    #new-game-button[hidden] { display: none; }

    #history {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .message .role {
      display: block;
      margin-bottom: 3px;
      font-size: .75rem;
      font-weight: 650;
      opacity: .75;
    }

    .You {
      align-self: flex-end;
      background: #464feb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .Engine {
      align-self: flex-start;
      background: #f0f1f3;
      border-bottom-left-radius: 4px;
    }

    #status {
      min-height: 1.4em;
      padding: 0 18px 8px;
      color: #666;
      font-size: .85rem;
      white-space: pre-line;
    }

    #setup {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e6e6e6;
    }

    form[hidden] { display: none; }

    #setup label { font-weight: 600; }

    select {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #c9cbd1;
      border-radius: 9px;
      background: white;
      font: inherit;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e6e6e6;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #c9cbd1;
      border-radius: 9px;
      font: inherit;
      font-size: 16px;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #464feb;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled, input:disabled, select:disabled { opacity: .55; }

    #go-button {
      margin: 0 14px 14px auto;
      padding: 10px 16px;
      background: #333;
    }

    #go-button[hidden] { display: none; }

    @media (max-width: 480px) {
      body { padding: 0; }
      main { min-height: 100vh; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="header-row">
        <h1>Maia OTB Chess</h1>
        <button id="new-game-button" type="button" hidden>New Game</button>
      </div>
      <p>Enter moves in SAN/UCI notation or commands: help, undo, resign, q.</p>
    </header>
    <form id="setup">
      <label for="player-color">Play as</label>
      <select id="player-color" name="color">
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
      <button id="start-button" type="submit">Start game</button>
    </form>
    <section id="history" aria-live="polite" aria-label="Move history"></section>
    <div id="status" role="status"></div>
    <form id="move-form" hidden>
      <input id="move-input" name="text" type="text"
             placeholder="Move or command (e.g. e4, undo, go)"
             autocomplete="off" autocapitalize="off" required aria-label="Your move">
      <button id="send-button" type="submit">Send</button>
    </form>
    <button id="go-button" type="button" hidden>Go now</button>
  </main>
  <script>
    const historyElement = document.querySelector("#history");
    const newGameButton = document.querySelector("#new-game-button");
    const setup = document.querySelector("#setup");
    const colorSelect = document.querySelector("#player-color");
    const startButton = document.querySelector("#start-button");
    const form = document.querySelector("#move-form");
    const input = document.querySelector("#move-input");
    const button = document.querySelector("#send-button");
    const goButton = document.querySelector("#go-button");
    const status = document.querySelector("#status");
    let waitingForEngine = false;
    let gameEnded = false;
    let canonicalHistory = [];

    function renderHistory(messages) {
      canonicalHistory = messages;
      historyElement.replaceChildren();
      for (const message of messages) {
        const bubble = document.createElement("article");
        bubble.className = `message ${message.role}`;
        const role = document.createElement("span");
        role.className = "role";
        role.textContent = message.role;
        const text = document.createElement("span");
        text.textContent = message.text;
        bubble.append(role, text);
        historyElement.append(bubble);
      }
      historyElement.scrollTop = historyElement.scrollHeight;
    }

    function appendMessage(roleName, messageText) {
      const bubble = document.createElement("article");
      bubble.className = `message ${roleName}`;
      const role = document.createElement("span");
      role.className = "role";
      role.textContent = roleName;
      const text = document.createElement("span");
      text.textContent = messageText;
      bubble.append(role, text);
      historyElement.append(bubble);
      historyElement.scrollTop = historyElement.scrollHeight;
    }

    function setWaitingForEngine(waiting) {
      waitingForEngine = waiting;
      historyElement.setAttribute("aria-busy", String(waiting));
      input.disabled = waiting || gameEnded;
      button.disabled = waiting || gameEnded;
      goButton.hidden = !waiting || gameEnded;
      goButton.disabled = false;
      newGameButton.disabled = waiting;
    }

    function renderState(data) {
      renderHistory(data.history || []);
      if (data.started) {
        setup.hidden = true;
        form.hidden = false;
        newGameButton.hidden = false;
      } else if (data.new_game) {
        setup.hidden = false;
        form.hidden = true;
        newGameButton.hidden = true;
        startButton.disabled = false;
        colorSelect.disabled = false;
        input.value = "";
        status.textContent = data.saved_pgn
          ? `Previous game saved to ${data.saved_pgn}. Choose a color to start again.`
          : "Choose a color to start a new game.";
      }
      gameEnded = Boolean(data.game_over || data.quit);
      if (gameEnded) setWaitingForEngine(false);
      if (data.game_over) {
        status.textContent = `Game over${data.result ? ` (${data.result})` : ""}.`;
      } else if (data.quit) {
        status.textContent = "Game quit.";
      } else if (data.maia_thinking) {
        setWaitingForEngine(true);
        status.textContent = "Maia is thinking; enter go to play now.";
      }
    }

    async function readResponse(response) {
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed.");
      return data;
    }

    newGameButton.addEventListener("click", async () => {
      newGameButton.disabled = true;
      try {
        const response = await fetch("/api/new-game", { method: "POST" });
        const data = await readResponse(response);
        renderState({ ...data, new_game: true });
        historyElement.removeAttribute("aria-busy");
        gameEnded = false;
        setWaitingForEngine(false);
        input.disabled = false;
        button.disabled = false;
      } catch (error) {
        status.textContent = error.message;
      } finally {
        newGameButton.disabled = false;
      }
    });

    setup.addEventListener("submit", async (event) => {
      event.preventDefault();
      startButton.disabled = true;
      colorSelect.disabled = true;
      status.textContent = colorSelect.value === "black"
        ? "Maia is thinking; enter go to play now."
        : "";
      setup.hidden = true;
      form.hidden = false;
      if (colorSelect.value === "black") setWaitingForEngine(true);
      input.focus();
      try {
        const response = await fetch("/api/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ color: colorSelect.value })
        });
        const data = await readResponse(response);
        renderState(data);
        setWaitingForEngine(false);
        if (data.messages && data.messages.length) {
          status.textContent = "";
        }
        input.focus();
      } catch (error) {
        status.textContent = error.message;
        setup.hidden = false;
        form.hidden = true;
        startButton.disabled = false;
        colorSelect.disabled = false;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const isMove = !["help", "undo", "resign", "concede", "q", "quit", "exit", "go"]
        .includes(text.toLowerCase());
      input.value = "";
      if (isMove) {
        appendMessage("You", text);
        setWaitingForEngine(true);
        status.textContent = "Maia is thinking. Select Go now to skip the delay.";
      } else {
        input.disabled = true;
        button.disabled = true;
      }
      try {
        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await readResponse(response);
        renderState(data);
        setWaitingForEngine(false);
        if (data.action === "help" || data.action === "undo" ||
            data.action === "resign" || data.action === "quit" ||
            data.action === "go") {
          status.textContent = data.message;
        } else if (!data.game_over && !data.quit) {
          status.textContent = "";
        }
      } catch (error) {
        renderHistory(canonicalHistory);
        status.textContent = error.message;
        setWaitingForEngine(false);
      }
      if (!input.disabled) input.focus();
    });

    goButton.addEventListener("click", async () => {
      goButton.disabled = true;
      status.textContent = "Skipping the remaining think time...";
      try {
        const response = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: "go" })
        });
        const data = await readResponse(response);
        if (data.action === "go") status.textContent = data.message;
      } catch (error) {
        status.textContent = error.message;
        goButton.disabled = false;
      }
    });

    fetch("/api/history")
      .then(readResponse)
      .then((data) => {
        renderState(data);
      })
      .catch((error) => { status.textContent = error.message; });
  </script>
</body>
</html>
