<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14171b">
  <title>{{ rating_label ~ " profile" if single_category else "Player profile" }} - Chess ladder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='chessground/assets/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='chessground/assets/style.css') }}">
</head>

<body>
  <div id="root"></div>
  <script>
    window.__PROFILE_DATA__ = {{ {
      "category": category,
      "ratingLabel": rating_label|default(none),
      "singleCategory": single_category|default(false),
      "playerElo": player_elo,
      "matches": matches|list,
      "colorStats": color_stats,
      "ratingPoints": rating_points,
      "ratingTicks": rating_ticks,
      "chartMin": chart_min,
      "chartMax": chart_max
    }|tojson }};
  </script>
  <script type="module" src="{{ url_for('static', filename='chessground/assets/profile.js') }}"></script>
</body>

</html>
